<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>舜达集运</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <style>
        div#container {
            margin: 0 auto;
            width: 1149px;
        }

        div#logo {
            width: 1149px;
            height: 390px;
            background-image: url("images/logo.png");
        }

        div#qrcode {
            text-align: center;
        }
        
        div#intro {
            width: 1149px;
            font-size: 16px;
            text-align: center;
            margin: 50px 0;
        }

        span#qrcode_space {
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="logo">
    </div>
    <div id="intro">
        扫码关注舜达全球公众号，扫码打开舜达全球小程序，享用舜达集运服务！
    </div>
    <div id="qrcode">
        <img src="images/shunda_qr1.jpg" alt="舜达集运公众号二维码"/>
        <span id="qrcode_space">&nbsp;</span>
        <img src="images/shunda_qr2.jpg" alt="舜达集运小程序二维码"/>
    </div>
</div>
</body>
